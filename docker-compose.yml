services:
  postgres:
    image: postgres:16
    container_name: weather_postgres
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/01_create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql
      - ./sql/03_dim_date.sql:/docker-entrypoint-initdb.d/03_dim_date.sql

volumes:
  pgdata: 